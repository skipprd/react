mobile_app_analytics:
  outputs:
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'DBT_MOBILE') }}"
      threads: 4
    athena:
      type: athena
      s3_staging_dir: "{{ env_var('ATHENA_S3_STAGING_DIR') }}"
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      work_group: "{{ env_var('ATHENA_WORKGROUP', 'primary') }}"
      database: "{{ env_var('ATHENA_DATABASE', 'analytics') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'dbt_mobile') }}"
      threads: 4
    bigquery:
      type: bigquery
      method: service-account-json
      project: "{{ env_var('BQ_PROJECT') }}"
      dataset: "{{ env_var('DBT_SCHEMA', 'dbt_mobile') }}"
      keyfile_json: "{{ env_var('BQ_SERVICE_ACCOUNT_JSON') }}"
      threads: 4
    motherduck:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE', 'my_db') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'dbt_mobile') }}"
      settings:
        motherduck_token: "{{ env_var('MOTHERDUCK_TOKEN') }}"
      threads: 4
  target: "{{ env_var('DBT_TARGET', 'snowflake') }}"





