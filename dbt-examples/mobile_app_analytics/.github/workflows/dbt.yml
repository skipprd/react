name: dbt build (example project)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        adapter: [snowflake, athena, bigquery]
    env:
      DBT_TARGET: ${{ matrix.adapter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt (matrix adapter)
        run: |
          pip install --upgrade pip
          pip install dbt-core
          if [ "${{ matrix.adapter }}" = "snowflake" ]; then
            pip install dbt-snowflake
          elif [ "${{ matrix.adapter }}" = "athena" ]; then
            pip install dbt-athena-community
          elif [ "${{ matrix.adapter }}" = "bigquery" ]; then
            pip install dbt-bigquery
          fi

      - name: Install project packages
        run: |
          dbt deps \
            --project-dir dbt-examples/mobile_app_analytics \
            --profiles-dir dbt-examples/mobile_app_analytics

      - name: Build
        env:
          # Snowflake
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          # Athena
          ATHENA_S3_STAGING_DIR: ${{ secrets.Athena_S3_STAGING_DIR }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ATHENA_WORKGROUP: ${{ secrets.ATHENA_WORKGROUP }}
          ATHENA_DATABASE: ${{ secrets.ATHENA_DATABASE }}
          # BigQuery
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
          BQ_SERVICE_ACCOUNT_JSON: ${{ secrets.BQ_SERVICE_ACCOUNT_JSON }}
          # Common
          DBT_SCHEMA: ${{ secrets.DBT_SCHEMA }}
          DBT_TARGET: ${{ env.DBT_TARGET }}
        run: |
          dbt build \
            --project-dir dbt-examples/mobile_app_analytics \
            --profiles-dir dbt-examples/mobile_app_analytics





