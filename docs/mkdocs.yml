site_name: Skippr dbt
site_description: Data pipeline CLI — extract, load, and model with dbt.
theme:
  name: material
  features:
    - navigation.footer
    - navigation.sections
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Home: index.md
  - Getting Started:
      - Install: getting-started/install.md
      - Quick Start: getting-started/quickstart.md
  - CLI Reference:
      - init: cli/init.md
      - connect: cli/connect.md
      - doctor: cli/doctor.md
      - run: cli/run.md
  - Configuration:
      - Config File: configuration/config-file.md
      - Environment Variables: configuration/environment-variables.md
  - Operations:
      - Logs and Artifacts: operations/logs.md
      - Troubleshooting: operations/troubleshooting.md
  - How It Works: how-it-works.md

markdown_extensions:
  - toc:
      permalink: True
