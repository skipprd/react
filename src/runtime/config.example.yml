server:
  port: 8089

storage:
  # Local-first storage: artifacts/threads/catalog/vectors are persisted under this path.
  mode: local
  path: "./.react"
  # Cloudflare R2 (S3-compatible). Auth is Skippr Cloud OBJECTS_* keys.
  # mode: r2
  # bucket: skippr-react-runtime

scope:
  tenant: "example"
  workspace: "default"
  project_id: "default"

llm:
  # "null" starts the server without an external LLM (useful for smoke tests)
  provider: "null"

providers:
  # Disable all providers for a pure server boot smoke test.
  athena:
    enabled: false
  catalog:
    enabled: false
  dbt:
    enabled: false
  vector:
    enabled: false

