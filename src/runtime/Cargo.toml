[package]
name = "react"
version = "1.5.0"
edition = "2021"
description = "Private Skippr React crate: react"
license = "Apache-2.0"
publish = false

[dependencies]
async-trait = "0.1.77"
axum = { version = "0.7", features = ["macros"] }
serde = "1.0.105"
serde_derive = "1.0.105"
serde_json = "1.0.85"
serde_yaml = "0.9.16"
chrono = "0.4.44"
regex = "1.7.0"
rand = "0.8.5"
once_cell = "1.17.0"
dashmap = "5.5.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"], default-features = false }
futures = "0.3.25"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
thiserror = "1.0.58"
bytes = "1.5.0"
tempfile = "3.10"
walkdir = { version = "2.3.2", features = [] }
itertools = "0.12"
hex = "0.4.3"
ureq = { version = "2", features = ["json"] }
react-core = { path = "../core", version = "1.5.0" }
react-http-protocol = { path = "../http-protocol", version = "1.5.0" }
react-module-storage-s3 = { path = "../modules/adaptors/storage-s3", version = "1.5.0" }
react-module-storage-local = { path = "../modules/adaptors/storage-local", version = "1.5.0" }
react-transport = { path = "../transport", version = "1.5.0" }

[dev-dependencies]
httpmock = "0.7"
react-module-storage-memory = { path = "../modules/adaptors/storage-memory", version = "1.5.0" }

[features]
llama_cpp = []

