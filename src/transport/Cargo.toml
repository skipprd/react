[package]
name = "react-transport"
version = "1.2.3"
edition = "2021"
description = "Private Skippr React crate: react-transport"
license = "Apache-2.0"
publish = ["react-cargo"]

[dependencies]
react-core = { path = "../core", version = "1.2.3", registry = "react-cargo" }
react-view = { path = "../view", version = "1.2.3", registry = "react-cargo" }
async-trait = "0.1.77"
serde = "1.0.105"
serde_json = "1.0.85"
chrono = "=0.4.42"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3.25"
futures-util = "0.3"
tokio-tungstenite = "0.21"
tungstenite = "0.21"
tracing = "0.1"
once_cell = "1.17.0"
crossterm = "0.27"

[dev-dependencies]
react-module-storage-memory = { path = "../modules/adaptors/storage-memory", version = "1.2.3", registry = "react-cargo" }
react-suite-kb = { path = "../suites/kb", version = "1.2.3", registry = "react-cargo" }
