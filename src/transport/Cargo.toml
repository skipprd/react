[package]
name = "react-transport"
version = "0.0.0-git"
edition = "2021"

[dependencies]
react-core = { path = "../core" }
react-view = { path = "../view" }
async-trait = "0.1.77"
serde = "1.0.105"
serde_json = "1.0.85"
chrono = "=0.4.42"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3.25"
futures-util = "0.3"
tokio-tungstenite = "0.21"
tungstenite = "0.21"
tracing = "0.1"
once_cell = "1.17.0"
