[package]
name = "react-core"
version = "1.4.1"
edition = "2021"
description = "Private Skippr React crate: react-core"
license = "Apache-2.0"
publish = ["react-cargo"]

[dependencies]
async-trait = "0.1.77"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.85"
chrono = "=0.4.42"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
once_cell = "1.17.0"
dashmap = "5.5.3"
sha2 = "0.10"
hex = "0.4.3"
schemars = { version = "1.2.1", features = ["derive"] }
jsonschema = "0.42.0"
thiserror = "2"

[features]
progress = []
