[package]
name = "skippr-admin"
version = "0.0.0-git"
edition = "2021"

[[bin]]
name = "skippr-admin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0.32", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = "=0.4.42"
uuid = { version = "1", features = ["v4"] }
rustyline = "14"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
aws-config = "1"
aws-sdk-dynamodb = "1"

react-core = { path = "../../core" }
react = { path = "../../runtime" }
react-module-storage-s3 = { path = "../../modules/adaptors/storage-s3" }
react-suite-debugger = { path = "../../suites/suite_debugger" }
react-suite-data-engineer = { path = "../../suites/data_engineer" }
react-suite-kb = { path = "../../suites/kb" }
