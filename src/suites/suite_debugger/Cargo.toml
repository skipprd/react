[package]
name = "react-suite-debugger"
version = "1.4.1"
edition = "2021"
description = "Private Skippr React crate: react-suite-debugger"
license = "Apache-2.0"
publish = ["react-cargo"]

[dependencies]
async-trait = "0.1.77"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.85"
chrono = "=0.4.42"
tokio = { version = "1", features = ["full"] }

react-core = { path = "../../core", version = "1.4.1", registry = "react-cargo" }
