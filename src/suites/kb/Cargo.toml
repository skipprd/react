[package]
name = "react-suite-kb"
version = "1.5.0"
edition = "2021"
description = "Private Skippr React crate: react-suite-kb"
license = "Apache-2.0"
publish = ["react-cargo"]

[dependencies]
async-trait = "0.1.77"
chrono = "0.4.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.85"
tokio = { version = "1", features = ["full"] }
walkdir = "2.3.2"

react-core = { path = "../../core", version = "1.5.0", registry = "react-cargo" }
