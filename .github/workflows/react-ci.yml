name: CI/CD Pipeline

on:
  push:
    tags:
      - "*"

env:
  RELEASES_BASE_URL: https://install.skippr.io/releases
  RELEASES_BUCKET: skippr-web-install-site-prod
  SKIPPR_RELEASE_SUBDIR: skippr
  SKIPPR_LATEST_POINTER: latest-skippr.txt
  RUST_BUILD_CACHE_BUCKET: skippr-web-rust-cache-prod

jobs:
  # ---------------------------------------------------------------------------
  # Core react: build + unit tests (no data_engineer suite, no integration runs)
  # ---------------------------------------------------------------------------
  react_core:
    name: Core react build + test
    runs-on: ubuntu-latest
    environment: Skippr
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      CARGO_TARGET_DIR: target
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: react
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable

      - name: Install sccache
        if: env.SCCACHE_BUCKET != ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      - name: Configure sccache
        if: env.SCCACHE_BUCKET != ''
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
  
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2-ubuntu-dev
  
      - name: Check OpenAPI generated artifact drift (core)
        run: bash scripts/check-openapi-drift-core.sh
  
      - name: Build react crate
        run: cargo build -p react
  
      - name: Test react crate
        run: cargo test -p react --lib --tests

      - name: Show sccache stats (unix)
        if: env.SCCACHE_BUCKET != '' && runner.os != 'Windows'
        shell: bash
        run: sccache --show-stats

      - name: Show sccache stats (windows)
        if: env.SCCACHE_BUCKET != '' && runner.os == 'Windows'
        shell: pwsh
        run: sccache --show-stats

  # ---------------------------------------------------------------------------
  # skippr: build + unit tests
  # ---------------------------------------------------------------------------
  skippr_test:
    name: skippr build + test
    runs-on: ubuntu-latest
    environment: Skippr
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      CARGO_TARGET_DIR: target
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: react
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable

      - name: Install sccache
        if: env.SCCACHE_BUCKET != ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      - name: Configure sccache
        if: env.SCCACHE_BUCKET != ''
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
  
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2-ubuntu-dev
  
      - name: Check OpenAPI generated artifact drift (data_engineer suite)
        run: bash scripts/check-openapi-drift-suite-data-engineer.sh
  
      - name: Enforce control-state log-read guardrails
        run: cargo test -p react-suite-data-engineer data_engineer::tests::control_state_thread_log_read_guardrails_are_enforced_in_rust_tests

      - name: Test data engineer SQL tool integration
        run: cargo test -p react-suite-data-engineer --test sql_cte

      - name: Test catalog provider integration
        run: cargo test -p react-module-provider-catalog --test catalog_provider_parity
  
      - name: Build skippr
        run: cargo build -p skippr
  
      - name: Test skippr
        run: cargo test -p skippr

      - name: Show sccache stats
        if: env.SCCACHE_BUCKET != ''
        shell: bash
        run: sccache --show-stats

  # ---------------------------------------------------------------------------
  # skippr: release binaries (macOS, Linux, Windows)
  # ---------------------------------------------------------------------------
  skippr_binary_build:
    name: skippr release (${{ matrix.name }})
    needs:
      - react_core
      - skippr_test
    timeout-minutes: 120
    environment: Skippr
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos arm64
            runs_on: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ""
          - name: linux x86_64
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
          - name: windows x86_64
            runs_on: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
    runs-on: ${{ matrix.runs_on }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      CARGO_TARGET_DIR: target
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: react
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
  
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
  
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sccache
        if: env.SCCACHE_BUCKET != ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      - name: Configure sccache (unix)
        if: env.SCCACHE_BUCKET != '' && runner.os != 'Windows'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV

      - name: Configure sccache (windows)
        if: env.SCCACHE_BUCKET != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          "SCCACHE_IDLE_TIMEOUT=0" >> $env:GITHUB_ENV
  
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2-release-${{ matrix.target }}
  
      - name: Build skippr release binary
        env:
          SKIPPR_CLI_VERSION: ${{ github.ref_name }}
        run: cargo build --release -p skippr --target ${{ matrix.target }}
  
      - name: Upload skippr artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: skippr-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/skippr${{ matrix.bin_ext }}
  
      - name: Upload skippr artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: skippr-${{ matrix.target }}
          path: target\${{ matrix.target }}\release\skippr${{ matrix.bin_ext }}

      - name: Show sccache stats
        if: env.SCCACHE_BUCKET != ''
        shell: bash
        run: sccache --show-stats

  # ---------------------------------------------------------------------------
  # skippr: Windows MSSQL -> Postgres end-to-end
  # ---------------------------------------------------------------------------
  skippr_el_windows_postgres_e2e:
    name: Windows MSSQL -> Postgres E2E (install.skippr.io + full CLI flow)
    needs:
      - publish
    if: "!startsWith(github.ref, 'refs/tags/test')"
    runs-on: windows-latest
    environment: Skippr
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install skippr via install.skippr.io
        shell: pwsh
        run: |
          irm https://install.skippr.io/install.ps1 | iex
          $env:PATH = "$env:LOCALAPPDATA\skippr\bin;$env:PATH"
          skippr --version

      - name: Install SQL Server Express
        shell: pwsh
        run: |
          choco install sql-server-express -y --no-progress
          $timeout = 120
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            $svc = Get-Service -Name 'MSSQL$SQLEXPRESS' -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') { break }
            Start-Sleep -Seconds 5
            $elapsed += 5
          }
          if ($elapsed -ge $timeout) {
            Write-Error "SQL Server Express did not start within ${timeout}s"
            exit 1
          }
          Write-Host "SQL Server Express is running."

      - name: Configure SQL Server for TCP and SA login
        shell: pwsh
        run: |
          Import-Module SqlServer -ErrorAction SilentlyContinue
          sqlcmd -S ".\SQLEXPRESS" -Q "EXEC sp_configure 'show advanced options', 1; RECONFIGURE;"
          sqlcmd -S ".\SQLEXPRESS" -Q "ALTER LOGIN sa ENABLE;"
          sqlcmd -S ".\SQLEXPRESS" -Q "ALTER LOGIN sa WITH PASSWORD = 'Skippr!Test123';"
          $mssqlServerPaths = Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.PSPath -like "*SQLEXPRESS\MSSQLServer" -and $_.PSPath -notlike "*SuperSocketNetLib*" -and $_.PSPath -notlike "*Parameters*" }
          foreach ($path in $mssqlServerPaths) {
            Set-ItemProperty -Path $path.PSPath -Name "LoginMode" -Value 2 -ErrorAction SilentlyContinue
            Write-Host "Set LoginMode=2 (Mixed Mode) on $($path.PSPath)"
          }
          $tcpPaths = Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.PSPath -like "*SuperSocketNetLib\Tcp" }
          foreach ($path in $tcpPaths) {
            Set-ItemProperty -Path $path.PSPath -Name "Enabled" -Value 1 -ErrorAction SilentlyContinue
          }
          $ipAllPaths = Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.PSPath -like "*SuperSocketNetLib\Tcp\IPAll" }
          foreach ($path in $ipAllPaths) {
            Set-ItemProperty -Path $path.PSPath -Name "TcpPort" -Value "1433" -ErrorAction SilentlyContinue
            Set-ItemProperty -Path $path.PSPath -Name "TcpDynamicPorts" -Value "" -ErrorAction SilentlyContinue
          }
          Restart-Service -Name 'MSSQL$SQLEXPRESS' -Force
          # Wait for TCP to be ready
          $timeout = 30; $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              $tcp = New-Object System.Net.Sockets.TcpClient("127.0.0.1", 1433)
              $tcp.Close()
              Write-Host "SQL Server TCP port 1433 is ready."
              break
            } catch {
              Start-Sleep -Seconds 2
              $elapsed += 2
            }
          }
          if ($elapsed -ge $timeout) { Write-Warning "TCP 1433 not ready after ${timeout}s" }

      - name: Create and seed MSSQL test database
        shell: pwsh
        run: |
          sqlcmd -S "localhost,1433" -U sa -P "Skippr!Test123" -Q "CREATE DATABASE testdb"
          sqlcmd -S "localhost,1433" -U sa -P "Skippr!Test123" -d testdb -i test\el-integration\seed.sql

      - name: Start PostgreSQL and configure
        shell: pwsh
        run: |
          $pgDir = (Get-ChildItem "C:\Program Files\PostgreSQL\*" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $pgBin = "$pgDir\bin"
          $pgData = "$env:USERPROFILE\pgdata"
          $env:PATH = "$pgBin;$env:PATH"
          Write-Host "PostgreSQL dir: $pgDir"
          # Remove stale data dir if present, let initdb create it with correct permissions
          if (Test-Path $pgData) { Remove-Item -Recurse -Force $pgData }
          $pwFile = New-TemporaryFile
          Set-Content -Path $pwFile -Value "Skippr!Test123"
          & "$pgBin\initdb.exe" -D $pgData -U postgres -A md5 --pwfile=$pwFile --encoding=UTF8
          Remove-Item $pwFile
          # Start via pg_ctl
          & "$pgBin\pg_ctl.exe" start -D $pgData -l "$env:USERPROFILE\pg.log" -w
          # Wait for TCP
          $timeout = 30; $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              $tcp = New-Object System.Net.Sockets.TcpClient("127.0.0.1", 5432)
              $tcp.Close(); Write-Host "PostgreSQL port 5432 is ready."; break
            } catch { Start-Sleep -Seconds 2; $elapsed += 2 }
          }
          if ($elapsed -ge $timeout) { Write-Error "PostgreSQL TCP 5432 not ready"; exit 1 }
          # Create test database
          psql "postgresql://postgres:Skippr!Test123@127.0.0.1:5432/postgres" -c "CREATE DATABASE testdb;"
          Write-Host "PostgreSQL testdb created."

      - name: Install dbt runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-postgres

      - name: Reset skippr E2E project state
        shell: pwsh
        env:
          SKIPPR_API_KEY: ${{ secrets.SKIPPR_API_KEY }}
          MSSQL_CONNECTION_STRING: "server=tcp:127.0.0.1,1433;database=testdb;user id=sa;password=Skippr!Test123;TrustServerCertificate=true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "Skippr!Test123"
          POSTGRES_DATABASE: testdb
        run: |
          $env:PATH = "$env:LOCALAPPDATA\skippr\bin;$env:PATH"
          $projectDir = Join-Path $env:RUNNER_TEMP "skippr-mssql-postgres-e2e"
          if (Test-Path $projectDir) { Remove-Item -Recurse -Force $projectDir }
          New-Item -ItemType Directory -Path $projectDir -Force | Out-Null
          Set-Location $projectDir
          cmd /c "echo yes|skippr init el_mssql_postgres_e2e --reset"
          skippr connect warehouse postgres --database testdb --schema public
          skippr connect source mssql --connection-string "$env:MSSQL_CONNECTION_STRING"
          skippr doctor

      - name: Run skippr EL + modeling pipeline
        shell: pwsh
        env:
          SKIPPR_API_KEY: ${{ secrets.SKIPPR_API_KEY }}
          MSSQL_CONNECTION_STRING: "server=tcp:127.0.0.1,1433;database=testdb;user id=sa;password=Skippr!Test123;TrustServerCertificate=true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "Skippr!Test123"
          POSTGRES_DATABASE: testdb
        run: |
          $env:PATH = "$env:LOCALAPPDATA\skippr\bin;$env:PATH"
          $projectDir = Join-Path $env:RUNNER_TEMP "skippr-mssql-postgres-e2e"
          Set-Location $projectDir
          skippr --log info run
          skippr feedback --good --comment "GitHub Actions Windows MSSQL -> Postgres E2E passed"

  skippr_el_windows_postgres_e2e_feedback:
    name: Submit feedback for failed Windows MSSQL -> Postgres E2E
    needs:
      - skippr_el_windows_postgres_e2e
    if: ${{ always() && (needs.skippr_el_windows_postgres_e2e.result == 'failure' || needs.skippr_el_windows_postgres_e2e.result == 'cancelled') }}
    runs-on: ubuntu-latest
    environment: Skippr
    steps:
      - uses: actions/checkout@v4

      - name: Install skippr via install.skippr.io
        shell: bash
        run: |
          curl -fsSL https://install.skippr.io/install.sh | sh
          skippr --version

      - name: Submit bad feedback for failed Postgres E2E
        shell: bash
        env:
          SKIPPR_API_KEY: ${{ secrets.SKIPPR_API_KEY }}
          MSSQL_CONNECTION_STRING: "server=tcp:127.0.0.1,1433;database=testdb;user id=sa;password=Skippr!Test123;TrustServerCertificate=true"
        run: |
          set -euo pipefail
          comment="GitHub Actions job 'Windows MSSQL -> Postgres E2E (install.skippr.io + full CLI flow)' failed with result '${{ needs.skippr_el_windows_postgres_e2e.result }}'. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          project_dir="$(mktemp -d)"
          cd "${project_dir}"
          skippr init el_mssql_postgres_e2e
          skippr connect warehouse postgres --database testdb --schema public
          skippr connect source mssql --connection-string "${MSSQL_CONNECTION_STRING}"
          skippr feedback --bad --comment "$comment"


  # ---------------------------------------------------------------------------
  # Publish skippr release
  # ---------------------------------------------------------------------------
  publish:
    name: Publish skippr Release
    if: "!startsWith(github.ref, 'refs/tags/test')"
    needs:
      - skippr_binary_build
    runs-on: ubuntu-latest
    environment: Skippr
    steps:
      - name: Check out code
        uses: actions/checkout@v4
  
      - name: Download skippr Artifacts
        uses: actions/download-artifact@v4
  
      - name: Compress Artifacts
        run: |
          shopt -s nullglob
          for d in skippr-*; do
            if [ -d "$d" ]; then
              tar -czvf "${d}.tar.gz" "$d"
            fi
          done
          ls -la skippr-*.tar.gz || true
  
      - name: Upload assets to GitHub Release (react repo)
        uses: softprops/action-gh-release@v1
        with:
          files: ./skippr-*.tar.gz
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish skippr binaries to skipprd/skipprd release
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Ensure the release exists (no-op if skippr-el already created it)
          gh release create "$TAG" \
            --repo skipprd/skipprd \
            --title "Release $TAG" \
            --notes "Release $TAG" 2>/dev/null || true
          # Upload skippr assets — --clobber overwrites same-name files
          # but never deletes other assets (e.g. skippr-el-*)
          gh release upload "$TAG" skippr-*.tar.gz \
            --repo skipprd/skipprd \
            --clobber

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload binaries to install releases bucket
        run: |
          TAG="${{ github.ref_name }}"
          BUCKET="${{ env.RELEASES_BUCKET }}"
          RELEASE_SUBDIR="${{ env.SKIPPR_RELEASE_SUBDIR }}"
          LATEST_POINTER="${{ env.SKIPPR_LATEST_POINTER }}"
          for f in skippr-*.tar.gz; do
            aws s3 cp "$f" "s3://${BUCKET}/releases/${RELEASE_SUBDIR}/${TAG}/${f}"
          done
          printf '%s' "$TAG" > "$LATEST_POINTER"
          aws s3 cp "$LATEST_POINTER" "s3://${BUCKET}/releases/${LATEST_POINTER}" --cache-control "no-cache, no-store, must-revalidate"
