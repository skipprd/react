name: CI/CD Pipeline

on:
  push:
    tags:
      - "*"

env:
  RUST_BUILD_CACHE_BUCKET: skippr-web-rust-cache-prod

jobs:
  # ---------------------------------------------------------------------------
  # Core react: build + unit tests (no product-owned suites, no integration runs)
  # ---------------------------------------------------------------------------
  react_core:
    name: Core react build + test
    runs-on: ubuntu-latest
    environment: Skippr
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      CARGO_TARGET_DIR: target
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: react
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable

      - name: Install sccache
        if: env.SCCACHE_BUCKET != ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      - name: Configure sccache
        if: env.SCCACHE_BUCKET != ''
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
  
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2-ubuntu-dev
  
      - name: Check OpenAPI generated artifact drift (core)
        run: bash scripts/check-openapi-drift-core.sh
  
      - name: Build react crate
        run: cargo build -p react
  
      - name: Test react crate
        run: cargo test -p react --lib --tests

      - name: Show sccache stats (unix)
        if: env.SCCACHE_BUCKET != '' && runner.os != 'Windows'
        shell: bash
        run: sccache --show-stats

      - name: Show sccache stats (windows)
        if: env.SCCACHE_BUCKET != '' && runner.os == 'Windows'
        shell: pwsh
        run: sccache --show-stats

