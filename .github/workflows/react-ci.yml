name: CI/CD Pipeline

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to publish"
        required: true

concurrency:
  group: react-release-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  CODEARTIFACT_DOMAIN: skippr
  CODEARTIFACT_REPOSITORY: react-cargo
  CODEARTIFACT_DOMAIN_OWNER: "132355036174"
  RUST_BUILD_CACHE_BUCKET: skippr-web-rust-cache-prod
  REACT_CRATES: >-
    react-http-protocol
    react-core
    react-view
    react-module-storage-s3
    react-module-storage-local
    react-module-storage-memory
    react-module-provider-vector-lance
    react-suite-kb
    react-suite-goggles-review
    react-suite-debugger
    react-transport
    react

jobs:
  release:
    name: Build, test, and publish React crates
    runs-on: ubuntu-latest
    environment: Skippr
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
      CARGO_TARGET_DIR: target
      SCCACHE_BUCKET: skippr-web-rust-cache-prod
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_KEY_PREFIX: react-publish
      SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
      SCCACHE_S3_USE_SSL: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable

      - name: Install sccache
        if: env.SCCACHE_BUCKET != ''
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      - name: Configure sccache
        if: env.SCCACHE_BUCKET != ''
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2-react-release

      - name: Resolve publish version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version || '' }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be plain semver, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify manifests match tag
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          for crate in $REACT_CRATES; do
            manifest="$(cargo metadata --no-deps --format-version=1 \
              | python3 -c 'import json,sys; crate=sys.argv[1]; data=json.load(sys.stdin); print(next(p["manifest_path"] for p in data["packages"] if p["name"] == crate))' "$crate")"
            actual="$(python3 -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1],"rb"))["package"]["version"])' "$manifest")"
            if [ "$actual" != "$version" ]; then
              echo "::error::$crate has version $actual, expected $version"
              exit 1
            fi
          done

      - name: Check OpenAPI generated artifact drift (core)
        run: bash scripts/check-openapi-drift-core.sh

      - name: Build react crate
        run: cargo build -p react

      - name: Test react crate
        run: cargo test -p react --lib --tests

      - name: Login to CodeArtifact
        shell: bash
        run: |
          token="$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --region "$AWS_REGION" \
            --query authorizationToken \
            --output text)"
          echo "::add-mask::$token"
          echo "CARGO_REGISTRIES_REACT_CARGO_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Publish React crates to CodeArtifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          for crate in $REACT_CRATES; do
            if aws codeartifact describe-package-version \
              --domain "$CODEARTIFACT_DOMAIN" \
              --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
              --repository "$CODEARTIFACT_REPOSITORY" \
              --format cargo \
              --package "$crate" \
              --package-version "$version" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "$crate $version already exists; skipping"
              continue
            fi
            cargo publish --registry react-cargo --no-verify -p "$crate"
          done

      - name: Show sccache stats
        if: env.SCCACHE_BUCKET != ''
        shell: bash
        run: sccache --show-stats
